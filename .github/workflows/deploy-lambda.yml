name: Deploy Lambda Container to ECR

# This workflow runs on every push to the main branch,
# but only if files inside the 'video_frame_lambda' directory have changed.
on:
  push:
    branches:
      - main
    paths:
      - 'video_frame_lambda/**'

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY:  steez-video-frame-extractor
  LAMBDA_FUNCTION_NAME: steez-video-frame-extractor

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Use the commit SHA to create a unique image tag for traceability
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./video_frame_lambda
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Lambda function to use the new image
        id: update-lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} 