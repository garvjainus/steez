name: "Build & Push FIRST Lambda image"

on:
  workflow_dispatch:

env:
  IMAGE_REPO: steez-video-frame-extractor
  FUNCTION_NAME: steez-video-frame-extractor

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: first
        working-directory: ./video_frame_lambda
        run: |
          docker build -t $REGISTRY/$IMAGE_REPO:$IMAGE_TAG .
          docker push $REGISTRY/$IMAGE_REPO:$IMAGE_TAG
          echo "image_uri=$REGISTRY/$IMAGE_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Print image URI
        run: echo "Image URI is ${{ steps.build-image.outputs.image_uri }}"