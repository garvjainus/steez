name: Build & Push FIRST Lambda image

on:
  workflow_dispatch: # adds a “Run workflow” button in Actions tab

env:
  IMAGE_REPO: steez-video-frame-extractor
  FUNCTION_NAME: steez-video-frame-extractor

jobs:
  build-push:
    runs-on: ubuntu-latest # runner already has Docker + AWS CLI
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: first # any tag you like
        working-directory: ./video_frame_lambda
        run: |
          docker build -t $REGISTRY/$IMAGE_REPO:$IMAGE_TAG .
          docker push $REGISTRY/$IMAGE_REPO:$IMAGE_TAG
          echo "IMAGE_URI=$REGISTRY/$IMAGE_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Print image URI
        run: echo "Pushed image: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_REPO }}:first"