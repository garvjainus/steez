services:
  - type: web
    name: steez-backend
    env: docker
    plan: free
    branch: main
    healthCheckPath: "/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        fromSecret: true
      - key: SUPABASE_ANON_KEY
        fromSecret: true
      - key: AWS_REGION
        fromSecret: true
      - key: AWS_ACCESS_KEY_ID
        fromSecret: true
      - key: AWS_SECRET_ACCESS_KEY
        fromSecret: true
      - key: LAMBDA_FUNCTION_NAME
        fromSecret: true
      - key: LAMBDA_SECRET
        fromSecret: true 