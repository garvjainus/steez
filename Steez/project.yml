name: Steez
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.8.1"
options:
  bundleIdPrefix: com.steez
  deploymentTarget:
    iOS: 15.0

configs:
  Debug: debug
  Release: release

targets:
  Steez:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "ShareExtension/**"
    dependencies:
      - package: Supabase
      - target: SteezShareExtension
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.steez.app
      configs:
        Debug: Configuration/Secrets.xcconfig
        Release: Configuration/Secrets.xcconfig
      INFOPLIST_KEY_SUPABASE_URL: $(SUPABASE_URL)
      INFOPLIST_KEY_SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
      INFOPLIST_KEY_SUPABASE_SERVICE_ROLE_KEY: $(SUPABASE_SERVICE_ROLE_KEY)
    buildRules:
      - fileType: asset
        action: copy
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
        INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
        INFOPLIST_KEY_CFBundleDisplayName: "Steez"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.steez.app"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/UI
      - path: Resources
    dependencies:
      - target: SteezCore
  SteezShareExtension:
    type: app-extension
    platform: iOS
    info:
      path: Sources/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Steez Share
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionActivationRule:
            NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: "com.steez.app.ShareExtension"
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_STYLE: Automatic
    sources:
      - path: Sources/ShareExtension
    dependencies:
      - target: SteezCore
  SteezCore:
    type: framework
    platform: iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: "com.steez.app.SteezCore"
    sources:
      - path: Sources/Core

schemes:
  Steez:
    build:
      targets:
        Steez: all
        SteezShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release